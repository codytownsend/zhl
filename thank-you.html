    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg: #FAF9F7;
            --color-dark: #252229;
            --color-gray: #6B7280;
            --color-border: #E5E5E5;
            --font-heading: 'Instrument Serif', serif;
            --font-body: 'Space Grotesk', sans-serif;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--color-bg);
            color: var(--color-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        .header {
            padding: 24px 48px;
            border-bottom: 1px solid var(--color-border);
        }

        .logo {
            height: 32px;
            width: auto;
        }

        /* Main Content */
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
        }

        .thank-you-container {
            text-align: center;
            max-width: 560px;
        }

        .checkmark {
            width: 80px;
            height: 80px;
            margin: 0 auto 32px;
            background: var(--color-dark);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.5s ease-out;
        }

        .checkmark svg {
            width: 40px;
            height: 40px;
            stroke: var(--color-bg);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .checkmark svg path {
            stroke-dasharray: 30;
            stroke-dashoffset: 30;
            animation: drawCheck 0.4s ease-out 0.3s forwards;
        }

        @keyframes scaleIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes drawCheck {
            to {
                stroke-dashoffset: 0;
            }
        }

        .thank-you-title {
            font-family: var(--font-heading);
            font-size: clamp(2.5rem, 5vw, 3.5rem);
            font-weight: 400;
            line-height: 1.1;
            margin-bottom: 16px;
            font-style: italic;
        }

        .thank-you-subtitle {
            font-size: 1.125rem;
            color: var(--color-gray);
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9375rem;
            font-weight: 500;
            color: var(--color-dark);
            text-decoration: none;
            padding: 14px 28px;
            border: 1px solid var(--color-dark);
            border-radius: 100px;
            transition: all 0.25s ease;
        }

        .back-link:hover {
            background: var(--color-dark);
            color: var(--color-bg);
        }

        .back-link svg {
            width: 18px;
            height: 18px;
            transition: transform 0.25s ease;
        }

        .back-link:hover svg {
            transform: translateX(-4px);
        }

        /* Footer */
        .footer {
            padding: 24px 48px;
            border-top: 1px solid var(--color-border);
            text-align: center;
        }

        .footer p {
            font-size: 0.875rem;
            color: var(--color-gray);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 20px 24px;
            }

            .footer {
                padding: 20px 24px;
            }

            .checkmark {
                width: 64px;
                height: 64px;
                margin-bottom: 24px;
            }

            .checkmark svg {
                width: 32px;
                height: 32px;
            }
        }
    </style>

    <script>
        !function (f, b, e, v, n, t, s) {

            n.queue = []; t = b.createElement(e); t.async = !0;
            t.src = v; s = b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t, s)
        }(window, document, 'script',
            'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '3878769909089465');
        fbq('track', 'PageView');
        fbq('track', 'Lead');
    </script>
    <noscript><img height="1" width="1" style="display:none"
            src="https://www.facebook.net/tr?id=3878769909089465&ev=PageView&noscript=1" /></noscript>
    <!-- End Meta Pixel Code -->
</head>

<body>
    <header class="header">
        <a href="/" aria-label="Zero Hour Labs home">
            <img src="img/ZHL-logo(dark).png" alt="Zero Hour Labs" class="logo">
        </a>
    </header>

    <main class="main">
        <div class="thank-you-container">
            <div class="checkmark">
                <svg viewBox="0 0 24 24">
                    <path d="M20 6L9 17l-5-5" />
                </svg>
            </div>
            <h1 class="thank-you-title">Message received</h1>
            <p class="thank-you-subtitle">
                Thanks for reaching out! Keep an eye on your inbox.<br>We'll be in touch soon!
            </p>
            <a href="/" class="back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M19 12H5" />
                    <path d="m12 19-7-7 7-7" />
                </svg>
                Back to homepage
            </a>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 Zero Hour Labs. All rights reserved.</p>
    </footer>
</body>

</html>
